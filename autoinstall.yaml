autoinstall:
  version: 1
  locale: en_US.UTF-8
  timezone: America/Sao_Paulo
  refresh-installer:
    update: true
  keyboard:
    layout: br
  storage:
    layout:
      name: lvm
  codecs:
    install: true
  drivers:
    install: true
  ssh:
    install-server: false
  interactive-sections:
    - network
    - locale
    - keyboard
    - storage
    - identity
  packages:
    - apt-transport-https
    - build-essential
    - ca-certificates
    - command-not-found
    - curl
    - fd-find
    - flatpak
    - gh
    - git
    - gnome-software-plugin-flatpak
    - gnupg
    - dconf-cli
    - jq
    - micro
    - ptyxis
    - ripgrep
    - software-properties-common
    - tree
    - unzip
    - wget
    - filezilla
    - gnome-shell-extension-manager
    - xclip
    - zsh
  user-data:
    disable_root: true
  late-commands:
    - curtin in-target --target=/target -- bash -lc 'rm -rf /opt/ubuntu-autoinstall && git clone --depth=1 https://github.com/Danielnatham/ubuntu-autoinstall /opt/ubuntu-autoinstall'
    - curtin in-target --target=/target -- bash -lc 'chmod +x /opt/ubuntu-autoinstall/post-install.sh'
    # Repositórios externos — Docker CE
    - curtin in-target --target=/target -- install -m 0755 -d /etc/apt/keyrings
    - curtin in-target --target=/target -- bash -c 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc && chmod a+r /etc/apt/keyrings/docker.asc'
    - curtin in-target --target=/target -- bash -c '. /etc/os-release && echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list'
    # Tailscale
    - curtin in-target --target=/target -- bash -c '. /etc/os-release && curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/${VERSION_CODENAME}.noarmor.gpg" -o /usr/share/keyrings/tailscale-archive-keyring.gpg'
    - curtin in-target --target=/target -- bash -c '. /etc/os-release && echo "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/tailscale.list'
    # Instalar pacotes dos repositórios customizados
    - curtin in-target --target=/target -- apt-get update
    - curtin in-target --target=/target -- apt-get install -y containerd.io docker-buildx-plugin docker-ce docker-ce-cli docker-compose-plugin tailscale
    # Habilitar serviços e configurar usuário
    - curtin in-target --target=/target -- systemctl enable docker
    - curtin in-target --target=/target -- systemctl enable tailscaled
    - curtin in-target --target=/target -- usermod -aG docker $USER
    - curtin in-target --target=/target -- bash -lc '/opt/ubuntu-autoinstall/post-install.sh'
    - curtin in-target --target=/target -- chsh -s /usr/bin/zsh $USER$USER
  shutdown: reboot
